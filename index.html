<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore restaurant locations and live line status around New York City."
    />
    <title>NYC Loves Lines</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css?v=2" />
  </head>
  <body>
    <main>
      <header class="map-header">
        <div>
        
          <h1>NYC Loves a Line 🧍🏻‍♀️🧍🏻🧍🏼‍♀️🧍🏽🧍🏾‍♀️🧍🏿</h1>
          <p></p>
          <p class="subtitle">Assess the line before you get in line.</p>
        </div>
        <div class="map-legend" aria-label="Map legend">
          <span><i class="legend-dot legend-dot--open"></i>Open</span>
          <span><i class="legend-dot legend-dot--closed"></i>Closed</span>
        </div>
      </div>  


      </header>
      <div id="map" role="region" aria-label="Map of restaurant locations"></div>
      <p id="map-status" class="map-status" role="status" aria-live="polite">
  
      </p>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="./map.js?v=21"></script>
  </body>
</html>
